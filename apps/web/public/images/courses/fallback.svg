<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bgGrad)" />
  <circle cx="640" cy="360" r="400" fill="url(#glow)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="540" x2="1280" y2="540" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
  </g>

  <!-- SV Logo & Badge -->
  <g transform="translate(640, 310)">
    <rect x="-60" y="-60" width="120" height="120" rx="28" fill="url(#accentGrad)" />
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">SV</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="640" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#f8fafc" text-anchor="middle" letter-spacing="1">StudentVerse Certified Programme</text>
  <text x="640" y="480" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#94a3b8" text-anchor="middle" letter-spacing="2">GLOBAL DIGITAL SKILLS &amp; VERIFIED HIRING PLATFORM</text>
</svg>
