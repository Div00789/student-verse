<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muskan Kawatra – AI Trainer Introduction Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #1e293b;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      border: 1px solid #1e293b;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }
    #videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #0f172a;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid #1e293b;
    }
    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-play {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-play:hover {
      background: #1d4ed8;
    }
    .btn-download {
      background: #16a34a;
      color: #ffffff;
    }
    .btn-download:hover {
      background: #15803d;
    }
    .timeline {
      flex: 1;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .timeline-progress {
      width: 0%;
      height: 100%;
      background: #3b82f6;
      transition: width 0.05s linear;
    }
    .time-display {
      font-size: 12px;
      color: #94a3b8;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      text-align: right;
    }
    .scene-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .scene-chip {
      background: #1e293b;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .scene-chip:hover, .scene-chip.active {
      border-color: #3b82f6;
      color: #ffffff;
      background: #1e3a8a;
    }
    .status-banner {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #1e293b;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1 class="title">Muskan Kawatra</h1>
        <span class="badge">AI Digital Marketing Trainer Video</span>
      </div>
      <div class="status-banner">
        <div class="dot"></div>
        <span>Native Indian Female Voice &bull; 1080p Studio Video</span>
      </div>
    </div>

    <!-- CANVAS VIEWPORT -->
    <div class="video-viewport">
      <canvas id="videoCanvas" width="1920" height="1080"></canvas>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="voiceAudio" src="muskan_voice.mp3" preload="auto"></audio>

    <!-- CONTROLS BAR -->
    <div class="controls">
      <button class="btn btn-play" id="playBtn" onclick="togglePlay()">
        ▶ Play Video
      </button>

      <div class="timeline" onclick="seek(event)">
        <div class="timeline-progress" id="timelineProgress"></div>
      </div>

      <div class="time-display" id="timeDisplay">00:00 / 01:15</div>

      <button class="btn btn-download" id="downloadBtn" onclick="startExport()">
        ⬇ Download Video (.webm)
      </button>
    </div>

    <!-- SCENE TIMELINE SELECTOR -->
    <div class="scene-chips">
      <div class="scene-chip active" onclick="jumpToScene(0)">1. Introduction</div>
      <div class="scene-chip" onclick="jumpToScene(1)">2. Practical Skills & Careers</div>
      <div class="scene-chip" onclick="jumpToScene(2)">3. Core Marketing Expertise</div>
      <div class="scene-chip" onclick="jumpToScene(3)">4. Teaching Methodology</div>
      <div class="scene-chip" onclick="jumpToScene(4)">5. Passion & AI Strategies</div>
      <div class="scene-chip" onclick="jumpToScene(5)">6. Mission & Closing</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('voiceAudio');
    const playBtn = document.getElementById('playBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const timelineProgress = document.getElementById('timelineProgress');
    const timeDisplay = document.getElementById('timeDisplay');

    // Load avatar photo
    const avatarImg = new Image();
    avatarImg.src = 'muskan-kawatra.jpg';
    let avatarLoaded = false;
    avatarImg.onload = () => {
      avatarLoaded = true;
      drawFrame();
    };

    // Audio Analysis for real-time lip sync
    let audioCtx, analyser, dataArray;
    let isAudioInitialized = false;

    function initAudioAnalysis() {
      if (isAudioInitialized) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        isAudioInitialized = true;
      } catch (e) {
        console.warn('AudioContext not allowed until interaction:', e);
      }
    }

    const SCRIPT_SCENES = [
      {
        id: 1,
        title: "Introduction",
        start: 0,
        end: 9.5,
        text: "Hi I am Muskan Kawatra a digital marketing trainer with over five years of experience in the digital marketing industry.",
        showLowerThird: true,
        keywords: []
      },
      {
        id: 2,
        title: "Practical Skills",
        start: 9.5,
        end: 19.5,
        text: "I specialize in helping students aspiring marketers and professionals develop practical digital marketing skills and successful careers.",
        showLowerThird: false,
        keywords: ["Career Development", "Practical Skills", "Live Mentorship"]
      },
      {
        id: 3,
        title: "Expertise",
        start: 19.5,
        end: 42.0,
        text: "My areas of expertise include SEO, AEO, GEO, social media marketing, Google Ads and Meta Ads, content marketing, Google Analytics, Google Tag Manager, email marketing, AI-powered digital marketing, HubSpot CRM and marketing automation.",
        showLowerThird: false,
        keywords: [
          "SEO, AEO and GEO",
          "Google Ads & Meta Ads",
          "GA4 & Google Tag Manager",
          "AI-Powered Marketing",
          "HubSpot CRM & Automation"
        ]
      },
      {
        id: 4,
        title: "Teaching Approach",
        start: 42.0,
        end: 54.0,
        text: "My teaching approach combines theoretical knowledge with practical implementation, real-world examples, live projects, and industry-relevant tools.",
        showLowerThird: false,
        keywords: ["Practical Implementation", "Real-World Examples", "Live Projects", "Industry-Relevant Tools"]
      },
      {
        id: 5,
        title: "Passion for Trends",
        start: 54.0,
        end: 66.5,
        text: "I am passionate about simplifying complex digital marketing concepts and keeping students updated with emerging technologies, industry trends, and AI-driven marketing strategies.",
        showLowerThird: false,
        keywords: ["Emerging Tech", "Industry Trends", "AI-Driven Strategies"]
      },
      {
        id: 6,
        title: "Mission & Closing",
        start: 66.5,
        end: 78.0,
        text: "My mission is to empower learners with the knowledge, practical skills, and confidence they need to become successful industry-ready digital marketing professionals. Thank you.",
        showLowerThird: true,
        keywords: ["Industry-Ready", "Verified Confidence"]
      }
    ];

    function getCurrentScene(time) {
      return SCRIPT_SCENES.find(s => time >= s.start && time < s.end) || SCRIPT_SCENES[SCRIPT_SCENES.length - 1];
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = Math.floor(secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // Natural Eye Blink & Subtle Face Movements
    let blinkProgress = 0;
    let nextBlinkTime = 3.0;

    function drawFrame() {
      const time = audio.currentTime || 0;
      const duration = audio.duration || 75;

      // 1. Draw Modern Studio Background
      const bgGradient = ctx.createRadialGradient(960, 400, 100, 960, 540, 1100);
      bgGradient.addColorStop(0, '#15213b');
      bgGradient.addColorStop(0.5, '#0b1120');
      bgGradient.addColorStop(1, '#04060c');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, 1920, 1080);

      // Studio Lighting Accents
      ctx.fillStyle = 'rgba(59, 130, 246, 0.08)';
      ctx.beginPath();
      ctx.arc(960, 200, 500, 0, Math.PI * 2);
      ctx.fill();

      // 2. Compute Voice Amplitude for Lip Synchronization
      let voiceAmplitude = 0;
      if (analyser && dataArray && !audio.paused) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        // Sample human speech frequency range (bins 2 to 24, approx 150Hz - 2500Hz)
        for (let i = 2; i < 25; i++) {
          sum += dataArray[i];
        }
        voiceAmplitude = Math.min(1.0, (sum / 23) / 120);
      }

      // 3. Subtle Natural Head Tilt and Breathing Sway
      const breathingOffset = Math.sin(time * 1.8) * 4;
      const headTilt = Math.sin(time * 0.8) * 0.005;

      // 4. Draw Avatar Character
      if (avatarLoaded) {
        ctx.save();
        ctx.translate(960, 1080 + breathingOffset);
        ctx.rotate(headTilt);

        // Aspect fit centered portrait
        const imgW = 900;
        const imgH = (avatarImg.height / avatarImg.width) * imgW;
        
        // Soft drop shadow
        ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = -10;

        ctx.drawImage(avatarImg, -imgW / 2, -imgH, imgW, imgH);
        ctx.restore();

        // 5. Lip Sync Overlay when Speaking
        if (voiceAmplitude > 0.12 && !audio.paused) {
          ctx.save();
          ctx.translate(960, 1080 + breathingOffset);
          ctx.rotate(headTilt);

          // Position matching Muskan's mouth coordinates
          const mouthCenterX = 0;
          const mouthCenterY = -imgH * 0.628;
          const mouthW = 48 + voiceAmplitude * 10;
          const mouthH = 12 + voiceAmplitude * 20;

          // Natural mouth cavity shadow
          ctx.fillStyle = 'rgba(55, 15, 20, 0.85)';
          ctx.beginPath();
          ctx.ellipse(mouthCenterX, mouthCenterY + 4, mouthW * 0.42, mouthH * 0.48, 0, 0, Math.PI * 2);
          ctx.fill();

          // Subtle upper lip highlight
          ctx.strokeStyle = 'rgba(190, 85, 95, 0.6)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(mouthCenterX, mouthCenterY + 1, mouthW * 0.4, 0.2 * Math.PI, 0.8 * Math.PI);
          ctx.stroke();

          ctx.restore();
        }

        // 6. Natural Eye Blink Animation
        if (time > nextBlinkTime) {
          blinkProgress += 0.2;
          if (blinkProgress >= 1.0) {
            blinkProgress = 0;
            nextBlinkTime = time + 3.0 + Math.random() * 3.5;
          }
          if (blinkProgress > 0) {
            ctx.save();
            ctx.translate(960, 1080 + breathingOffset);
            ctx.rotate(headTilt);
            
            // Eye coordinates
            const leftEyeX = -imgH * 0.055;
            const rightEyeX = imgH * 0.055;
            const eyeY = -imgH * 0.735;
            const eyeW = 32;

            ctx.strokeStyle = 'rgba(40, 25, 20, 0.7)';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.ellipse(leftEyeX, eyeY, eyeW * 0.5, 2, 0, 0, Math.PI * 2);
            ctx.ellipse(rightEyeX, eyeY, eyeW * 0.5, 2, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // 7. Draw Current Scene Overlays
      const currentScene = getCurrentScene(time);

      // A. Lower Third Banner (Scene 1 & Closing)
      if (currentScene.showLowerThird) {
        ctx.save();
        const ltX = 80;
        const ltY = 820;
        const ltW = 540;
        const ltH = 130;

        // Frosted glass background
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.roundRect(ltX, ltY, ltW, ltH, 16);
        ctx.fill();

        // Left accent bar
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath();
        ctx.roundRect(ltX, ltY, 8, ltH, [16, 0, 0, 16]);
        ctx.fill();

        // Texts
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 28px Poppins';
        ctx.fillText('Muskan Kawatra', ltX + 32, ltY + 44);

        ctx.fillStyle = '#93c5fd';
        ctx.font = '500 20px Poppins';
        ctx.fillText('Digital Marketing Trainer', ltX + 32, ltY + 78);

        ctx.fillStyle = '#10b981';
        ctx.font = '600 16px Poppins';
        ctx.fillText('5+ YEARS INDUSTRY EXPERIENCE', ltX + 32, ltY + 108);

        ctx.restore();
      }

      // B. Animated Keyword Callouts (Right side)
      if (currentScene.keywords && currentScene.keywords.length > 0) {
        ctx.save();
        let kwY = 180;
        currentScene.keywords.forEach((kw, i) => {
          const kwX = 1420;
          const pillW = 420;
          const pillH = 54;

          ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.strokeStyle = 'rgba(99, 102, 241, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.shadowColor = 'rgba(0,0,0,0.4)';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.roundRect(kwX, kwY, pillW, pillH, 12);
          ctx.fill();
          ctx.stroke();

          // Dot indicator
          ctx.shadowColor = 'transparent';
          ctx.fillStyle = '#3b82f6';
          ctx.beginPath();
          ctx.arc(kwX + 24, kwY + 27, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f1f5f9';
          ctx.font = '600 20px Poppins';
          ctx.fillText(kw, kwX + 44, kwY + 34);

          kwY += 72;
        });
        ctx.restore();
      }

      // C. Subtitles at Bottom
      if (currentScene.text) {
        ctx.save();
        ctx.font = '600 24px Poppins';
        const textMetrics = ctx.measureText(currentScene.text);
        const subW = Math.min(1600, textMetrics.width + 60);
        const subH = 54;
        const subX = 960 - subW / 2;
        const subY = 990;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.beginPath();
        ctx.roundRect(subX, subY, subW, subH, 10);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(currentScene.text, 960, subY + 36);
        ctx.restore();
      }

      // Update UI Timeline Progress
      const pct = (time / duration) * 100;
      timelineProgress.style.width = `${pct}%`;
      timeDisplay.textContent = `${formatTime(time)} / ${formatTime(duration)}`;

      // Highlight active scene chip
      const chips = document.querySelectorAll('.scene-chip');
      chips.forEach((c, idx) => {
        if (SCRIPT_SCENES[idx] === currentScene) {
          c.classList.add('active');
        } else {
          c.classList.remove('active');
        }
      });

      if (!audio.paused && !audio.ended) {
        requestAnimationFrame(drawFrame);
      }
    }

    function togglePlay() {
      initAudioAnalysis();
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '⏸ Pause Video';
        requestAnimationFrame(drawFrame);
      } else {
        audio.pause();
        playBtn.innerHTML = '▶ Play Video';
      }
    }

    audio.onended = () => {
      playBtn.innerHTML = '▶ Play Video';
      audio.currentTime = 0;
      drawFrame();
    };

    function seek(event) {
      const rect = event.currentTarget.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = pct * (audio.duration || 75);
      drawFrame();
    }

    function jumpToScene(idx) {
      if (SCRIPT_SCENES[idx]) {
        audio.currentTime = SCRIPT_SCENES[idx].start;
        drawFrame();
      }
    }

    // Direct Browser Recording & MP4/WEBM Export
    let mediaRecorder = null;
    let recordedChunks = [];

    function startExport() {
      initAudioAnalysis();
      downloadBtn.disabled = true;
      downloadBtn.innerHTML = '⏳ Recording Video (Please wait)...';

      // 1. Capture stream from canvas at 30 FPS
      const canvasStream = canvas.captureStream(30);

      // 2. Capture audio stream from audio element via Web Audio
      const audioDestination = audioCtx.createMediaStreamDestination();
      const audioSource = audioCtx.createMediaElementSource(audio);
      audioSource.connect(audioDestination);
      audioSource.connect(audioCtx.destination);

      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDestination.stream.getAudioTracks()
      ]);

      recordedChunks = [];
      const mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9,opus')
        ? 'video/webm; codecs=vp9,opus'
        : 'video/webm';

      mediaRecorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: 4000000 });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'muskan_kawatra_intro.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = '⬇ Download Video (.webm)';
        alert('Video generated and downloaded successfully!');
      };

      // Restart audio from start and record
      audio.currentTime = 0;
      mediaRecorder.start();
      audio.play();
      requestAnimationFrame(drawFrame);

      audio.onended = () => {
        mediaRecorder.stop();
        playBtn.innerHTML = '▶ Play Video';
      };
    }
  </script>
</body>
</html>
